name: Deploy Documentation Site

on:
  # Trigger on push to current branch for easier testing
  push:
    branches: [ develop, main, deploy-test, feat/site-autodeploy ]
    paths: [ 'sites/**', '.github/workflows/deploy-site.yml' ]

  # Optional manual trigger for testing/debugging
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (e.g., v0.2.0)'
        required: false
        type: string
      release_url_override:
        description: 'Override release URL'
        required: false
        type: string
      build_artifact_override:
        description: 'Override build artifact name'
        required: false
        type: string

  # Only trigger when build-site workflow completes (commented out for testing)
  # workflow_run:
  #   workflows: ["Build Documentation Site"]
  #   types: [completed]

permissions:
  contents: write

jobs:
  # Build and deploy documentation site
  deploy-site:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Extract deployment info and check for artifacts
        id: info
        run: |
          # Extract deployment information for push-based triggers
          VERSION=""
          RELEASE_URL=""
          ARTIFACT_NAME=""
          SOURCE="push"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Always use latest released tag
            echo "🏷️  Getting latest released tag..."
            LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              jq -r '.tag_name')

            if [[ -n "$LATEST_TAG" && "$LATEST_TAG" != "null" ]]; then
              VERSION="$LATEST_TAG"
              echo "✅ Found latest release tag: $VERSION"
            else
              echo "❌ No release tags found in repository"
              echo "This deployment requires at least one published release tag"
              exit 1
            fi

            # Check for available artifacts from build-site workflow using GitHub API
            echo "🔍 Checking for available artifacts for tag: $VERSION..."
            ARTIFACT_CHECK=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=50" | \
              jq -r '.artifacts[] | select(.workflow_run.head_branch == "${{ github.ref_name }}" and (.name | startswith("site-build-"))) | .name' | \
              head -1)

            if [[ -n "$ARTIFACT_CHECK" ]]; then
              ARTIFACT_NAME="$ARTIFACT_CHECK"
              echo "✅ Found artifact: $ARTIFACT_NAME"
            else
              echo "❌ No build artifacts found for branch ${{ github.ref_name }}"
              echo "This could mean:"
              echo "  - The build-site workflow hasn't run yet"
              echo "  - The build-site workflow failed"
              echo "  - Artifacts have expired (30-day retention)"
              exit 1
            fi

            RELEASE_URL="https://github.com/SIAJI-Labs/chauffeur/releases/tag/$VERSION"
            SOURCE="push"
            echo "🚀 Deploying latest release: $VERSION"
            echo "  Triggered by push to branch: ${{ github.ref_name }}"
            echo "  Version: $VERSION"
            echo "  Artifact: $ARTIFACT_NAME"
            echo "  Release URL: $RELEASE_URL"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger with optional overrides
            if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
              VERSION="${{ github.event.inputs.version_override }}"
              if [[ -n "${{ github.event.inputs.release_url_override }}" ]]; then
                RELEASE_URL="${{ github.event.inputs.release_url_override }}"
              else
                RELEASE_URL="https://github.com/SIAJI-Labs/chauffeur/releases/tag/$VERSION"
              fi
            else
              VERSION="latest"
              RELEASE_URL="https://github.com/SIAJI-Labs/chauffeur/commit/${{ github.sha }}"
            fi

            # For manual triggers, use the latest available artifact using GitHub API
            ARTIFACT_CHECK=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=10" | \
              jq -r '.artifacts[] | select(.name and (.name | startswith("site-build-"))) | .name' | \
              head -1)

            if [[ -n "$ARTIFACT_CHECK" ]]; then
              ARTIFACT_NAME="$ARTIFACT_CHECK"
            elif [[ -n "${{ github.event.inputs.build_artifact_override }}" ]]; then
              ARTIFACT_NAME="${{ github.event.inputs.build_artifact_override }}"
            else
              ARTIFACT_NAME="site-build-${{ github.run_id }}"
            fi

            SOURCE="manual"
            echo "🔨 Manual trigger with version: $VERSION"
            echo "📦 Artifact: $ARTIFACT_NAME"
          fi

          # Output for use in later steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT

          echo "📋 Deployment Information:"
          echo "  Version: $VERSION"
          echo "  Release URL: $RELEASE_URL"
          echo "  Artifact: $ARTIFACT_NAME"
          echo "  Source: $SOURCE"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 300s
          command_timeout: 60s
          envs: VERSION,RELEASE_URL,ARTIFACT_NAME,TRIGGER_SOURCE,COMMIT_SHA
          script: |
            # Set environment variables
            export VERSION="${{ steps.info.outputs.version }}"
            export RELEASE_URL="${{ steps.info.outputs.release_url }}"
            export ARTIFACT_NAME="${{ steps.info.outputs.artifact_name }}"
            export TRIGGER_SOURCE="${{ steps.info.outputs.source }}"
            export COMMIT_SHA="${{ github.sha }}"
            export SITE_ROOT_PATH="${{ secrets.ENV_SITE_ROOT_PATH }}"
            export GITHUB_REPO="${{ github.repository }}"
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            echo "🚀 Starting Chauffeur Documentation Site Deployment"
            echo "Version: $VERSION"
            echo "Source: $TRIGGER_SOURCE"
            echo "Artifact: $ARTIFACT_NAME"
            echo "Site Root Path: $SITE_ROOT_PATH"

            # Navigate to site root path for direct download and extraction
            cd "$SITE_ROOT_PATH"

            # Backup current deployment if it exists in site root
            if [ -d "public" ]; then
              echo "📦 DEBUG: Would create backup of current deployment..."
              BACKUP_NAME="backup-$(date +%Y%m%d-%H%M%S)"
              echo "🔧 DEBUG: Backup name would be: $BACKUP_NAME"
              echo "📁 DEBUG: Would create backup directory: $SITE_ROOT_PATH/backups"
              # mkdir -p "$SITE_ROOT_PATH/backups"
              # cp -r "public" "$SITE_ROOT_PATH/backups/$BACKUP_NAME"
              echo "✅ DEBUG: Backup would be created: $BACKUP_NAME"

              # Cleanup old backups (keep only 5 latest)
              echo "🧹 DEBUG: Would clean up old backups (keeping latest 5)..."
              # cd "$SITE_ROOT_PATH/backups"
              # ls -1t | tail -n +6 | xargs -r rm -rf
              # cd "$SITE_ROOT_PATH"
              echo "✅ DEBUG: Backup cleanup would be completed"
            else
              echo "ℹ️ DEBUG: No existing public directory found to backup"
            fi

            # Clean up only the public directory
            echo "🧹 DEBUG: Would clean up current public directory..."
            # rm -rf public/
            echo "✅ DEBUG: Public directory cleanup would be completed"

            # Create deployment info (DEBUG: Commented out)
            echo "📊 DEBUG: Would create deployment-info.json with:"
            echo "  - Version: $VERSION"
            echo "  - Release URL: $RELEASE_URL"
            echo "  - Artifact: $ARTIFACT_NAME"
            echo "  - Trigger: $TRIGGER_SOURCE"
            echo "  - Commit: $COMMIT_SHA"
            echo "  - Site Root: $SITE_ROOT_PATH"

            # Download artifact directly from GitHub to server (DEBUG: Commented out)
            echo "⬇️  DEBUG: Would download artifact: $ARTIFACT_NAME"

            # Get artifact download URL (DEBUG: Active for testing)
            echo "🔍 DEBUG: Getting artifact download URL from GitHub API"
            echo "📡 DEBUG: Querying GitHub repo: $GITHUB_REPO"
            echo "🔍 DEBUG: Looking for artifact: $ARTIFACT_NAME"

            ARTIFACT_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPO/actions/artifacts" | \
              jq -r ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .archive_download_url" | \
              head -1)

            echo "📥 DEBUG: Checking artifact URL result..."

            if [ -n "$ARTIFACT_URL" ]; then
              echo "✅ DEBUG: Successfully found artifact download URL"
              echo "🔗 DEBUG: Download URL: ${ARTIFACT_URL:0:50}... (truncated for security)"
              echo "📥 Downloading artifact from: $ARTIFACT_URL"
              
              echo "📥 DEBUG: Would download artifact to artifact.zip"
              echo "📂 DEBUG: Would extract artifact to $SITE_ROOT_PATH"
              echo "🗂️ DEBUG: Would expect 'public' directory in extracted files"
              echo "🧹 DEBUG: Would remove artifact.zip after extraction"

            #   # Download artifact
            #   curl -L -H "Authorization: token $GITHUB_TOKEN" \
            #     "$ARTIFACT_URL" -o "artifact.zip"

              # Extract artifact directly to site root (contains public/ directory)
              echo "📂 Extracting artifact to $SITE_ROOT_PATH..."
            #   unzip -q artifact.zip

              # Remove the zip file
            #   rm artifact.zip

              # Check if public directory exists (expected structure)
              if [ -d "public" ]; then
                echo "✅ Artifact extracted successfully with public directory"
                echo "📁 Public directory contents:"
                ls -la public/ | head -10
              else
                echo "⚠️  Warning: No 'public' directory found in artifact"
                echo "📁 Current directory contents:"
                ls -la
              fi
            else
              echo "❌ DEBUG: Failed to get artifact download URL for: $ARTIFACT_NAME"
              echo "🔍 DEBUG: This could mean:"
              echo "  - Artifact doesn't exist"
              echo "  - GitHub token permissions insufficient"
              echo "  - Artifact has expired"
              echo "  - Artifact name mismatch"

              echo "🔄 DEBUG: Would restore site from latest backup..."

              # Find the latest backup
              LATEST_BACKUP=$(ls -1t "$SITE_ROOT_PATH/backups" 2>/dev/null | head -1)

              if [[ -n "$LATEST_BACKUP" ]]; then
                echo "📦 DEBUG: Would restore from backup: $LATEST_BACKUP"
                echo "✅ DEBUG: Site would be restored from backup successfully"
                echo "🌍 DEBUG: Site would remain available at: https://$DOMAIN"
              else
                echo "⚠️  DEBUG: No backups found to restore from"
                echo "🚨 DEBUG: Site would be unavailable until manual intervention"
              fi

              echo "❌ DEBUG: Deployment would fail with exit code 1"
              # exit 1
            fi

            # === DEBUG MODE: Show all environment variables ===
            echo ""
            echo "🐛 === DEBUG ENVIRONMENT VARIABLES ==="
            echo "VERSION: $VERSION"
            echo "RELEASE_URL: $RELEASE_URL"
            echo "ARTIFACT_NAME: $ARTIFACT_NAME"
            echo "TRIGGER_SOURCE: $TRIGGER_SOURCE"
            echo "COMMIT_SHA: $COMMIT_SHA"
            echo "SITE_ROOT_PATH: $SITE_ROOT_PATH"
            echo "GITHUB_REPO: $GITHUB_REPO"
            echo "DOMAIN: $DOMAIN"
            echo "GITHUB_TOKEN: ${GITHUB_TOKEN:0:10}... (truncated for security)"
            echo ""

            echo "✅ DEBUG: SSH connection successful!"
            echo "🌍 DEBUG: Would deploy to: https://$DOMAIN"
            echo "📁 DEBUG: Would deploy to: $SITE_ROOT_PATH/public"
            echo "📦 DEBUG: Would download artifact: $ARTIFACT_NAME"
            echo "🔧 DEBUG: All deployment operations are commented out for testing"

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Successfully deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Version**: ${{ steps.info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Domain**: ${{ secrets.VPS_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Release**: [${{ steps.info.outputs.version }}](${{ steps.info.outputs.release_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ steps.info.outputs.source }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: ${{ steps.info.outputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [${{ github.sha }}](https://github.com/SIAJI-Labs/chauffeur/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed At**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌍 **Site URL**: https://${{ secrets.VPS_DOMAIN }}" >> $GITHUB_STEP_SUMMARY