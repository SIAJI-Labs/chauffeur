# Caddy configuration template for general PHP applications
{{#SITE_DOMAIN}}
{{SERVER_NAME}} {
	root {{PROJECT_ROOT}}
	php_fastcgi unix:{{PHP_FPM_SOCKET}}

	file_server
	
	# Security headers
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
	}
	
	# Handle static files with caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
}

{{#SSL}}
{{SERVER_NAME}} {
	root {{PROJECT_ROOT}}
	php_fastcgi unix:{{PHP_FPM_SOCKET}}

	file_server
	
	tls internal
	
	# Enhanced security headers for HTTPS
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
	}
	
	# Handle static files with caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
}
{{/SSL}}
{{/SITE_DOMAIN}}

# If no domain specified, use local access
{{^SITE_DOMAIN}}
:8080 {
	root {{PROJECT_ROOT}}
	php_fastcgi unix:{{PHP_FPM_SOCKET}}

	file_server
	
	# Security headers
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
	}
	
	# Handle static files with caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
}
{{/SITE_DOMAIN}}
