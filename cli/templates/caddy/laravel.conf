# Caddy configuration template for Laravel applications
{{#SITE_DOMAIN}}
{
	auto_https off
}

{{SERVER_NAME}}:8080 {
	root {{PROJECT_ROOT}}/public
	php_fastcgi unix:{{PHP_FPM_SOCKET}} {
		root {{PROJECT_ROOT}}/public
	}

	file_server
	
	# Security headers optimized for Laravel
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
	}
	
	# Laravel-specific routing
	@notStatic {
		not {
			path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
		}
	}
	
	handle @notStatic {
		rewrite /* /index.php?{query}
	}
	
	# Handle static files with long caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
	
	# Laravel storage access from public
	handle /storage/app/public/* {
		root {{PROJECT_ROOT}}/storage/app
		file_server
		header Cache-Control "public, max-age=31536000"
	}
	
	# Block access to sensitive files
	@sensitive {
		path .env *.config *.key __MACOSX .git .* 
	}
	
	handle @sensitive {
		respond 404
	}
}

{{#SSL}}
{{SERVER_NAME}}:8443 {
	root {{PROJECT_ROOT}}/public
	php_fastcgi unix:{{PHP_FPM_SOCKET}} {
		root {{PROJECT_ROOT}}/public
	}

	file_server
	
	tls internal
	
	# Enhanced security headers for HTTPS
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		# Laravel uses session cookie over HTTPS
		Cookie "SameSite=Lax"
	}
	
	# Laravel-specific routing
	@notStatic {
		not {
			path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
		}
	}
	
	handle @notStatic {
		rewrite /* /index.php?{query}
	}
	
	# Handle static files with long caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
	
	# Laravel storage access from public
	handle /storage/app/public/* {
		root {{PROJECT_ROOT}}/storage/app
		file_server
		header Cache-Control "public, max-age=31536000"
	}
	
	# Block access to sensitive files
	@sensitive {
		path .env *.config *.key __MACOSX .git .* 
	}
	
	handle @sensitive {
		respond 404
	}
}
{{/SSL}}
{{/SITE_DOMAIN}}

