	# WordPress admin and includes
	@wordpress {
		path /wp-admin* /wp-includes* /wp-content*
	}
	
	handle @wordpress {
		php_fastcgi unix:{{PHP_FPM_SOCKET}} {
			root {{PROJECT_ROOT}}
		}
	}
	
	# Handle static files with caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=2592000"
		file_server
	}
	
	# WordPress uploads with security
	@uploads {
		path /wp-content/uploads/*.php
	}
	
	handle @uploads {
		respond 404
	}
	
	# Block access to sensitive WordPress files
	@sensitive {
		path /wp-config.php /readme.html /license.txt
	}
	
	handle @sensitive {
		respond 404
	}
	
	# Block access to wp-admin php files directly
	@adminPhp {
		path /wp-admin/*.php /wp-includes/*.php
	}
	
	handle @adminPhp {
		respond 404
	}
}
{{/SSL}}
{{/SITE_DOMAIN}}

