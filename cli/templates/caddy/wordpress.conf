# Caddy configuration template for WordPress applications
{{#SITE_DOMAIN}}
{
	auto_https off
}

{{SERVER_NAME}}:8080 {
	root {{PROJECT_ROOT}}
	php_fastcgi unix:{{PHP_FPM_SOCKET}} {
		root {{PROJECT_ROOT}}
	}

	file_server
	
	# Security headers optimized for WordPress
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
	}
	
	# WordPress pretty permalinks
	@php {
		path *.php
	}
	
	handle @php {
		php_fastcgi unix:{{PHP_FPM_SOCKET}} {
			root {{PROJECT_ROOT}}
		}
	}
	
	# WordPress admin and includes
	@wordpress {
		path /wp-admin* /wp-includes* /wp-content*
	}
	
	handle @wordpress {
		php_fastcgi unix:{{PHP_FPM_SOCKET}} {
			root {{PROJECT_ROOT}}
		}
	}
	
	# Handle static files with caching
	@static {
		path *.css *.js *.png *.jpg *.jpeg *.gif *.ico *.svg *.woff *.woff2 *.ttf *.eot
	}
	
	handle @static {
		header Cache-Control "public, max-age=2592000"
		file_server
	}
	
	# WordPress uploads with security
	@uploads {
		path /wp-content/uploads/*.php
	}
	
	handle @uploads {
		respond 404
	}
	
	# Block access to sensitive WordPress files
	@sensitive {
		path /wp-config.php /readme.html /license.txt
	}
	
	handle @sensitive {
		respond 404
	}
	
	# Block access to wp-admin php files directly
	@adminPhp {
		path /wp-admin/*.php /wp-includes/*.php
	}
	
	handle @adminPhp {
		respond 404
	}
}

{{#SSL}}
{{SERVER_NAME}}:8443 {
	root {{PROJECT_ROOT}}
	php_fastcgi unix:{{PHP_FPM_SOCKET}} {
		root {{PROJECT_ROOT}}
	}

	file_server
	
	tls internal
	
	# Enhanced security headers for HTTPS
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options SAMEORIGIN
		X-XSS-Protection "1; mode=block"
		Referrer-Policy "strict-origin-when-cross-origin"
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
	}
	
	# WordPress pretty permalinks
	@php {
		path *.php
	}
	
	handle @php {
		php_fastcgi unix:{{PHP_FPM_SOCKET}} {
