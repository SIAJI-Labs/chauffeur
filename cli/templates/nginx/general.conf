# Nginx configuration template for general PHP applications
# This template provides standard PHP-FPM routing with security headers

upstream {{PROJECT_SLUG}}_php {
    server unix:{{PHP_FPM_SOCKET}};
}

server {
    listen 8080;
    listen [::]:8080;
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}};
    index index.php index.html index.htm;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access.log;
    error_log {{LOGS_DIR}}/nginx-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main location block for PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Static file handling
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle requests for non-existent PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}

{{#SSL}}
# HTTPS configuration (internal)
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}};
    index index.php index.html index.htm;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access-ssl.log;
    error_log {{LOGS_DIR}}/nginx-error-ssl.log;

    # SSL configuration (internal)
    ssl_certificate {{CADDY_SSL_CERT}};
    ssl_certificate_key {{CADDY_SSL_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Main location block for PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Static file handling
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle requests for non-existent PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
{{/SSL}}
