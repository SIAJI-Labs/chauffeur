# Nginx configuration template for Laravel applications
# Optimized for Laravel with proper URL rewriting and public directory handling

upstream {{PROJECT_SLUG}}_php {
    server unix:{{PHP_FPM_SOCKET}};
}

server {
    listen {{NGINX_HTTP_PORT}};
    listen [::]:{{NGINX_HTTP_PORT}};
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}}/public;
    index index.php index.html index.htm;

    # Increase maximum file upload size (256MB)
    client_max_body_size 256M;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access.log;
    error_log {{LOGS_DIR}}/nginx-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel-specific configuration
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Laravel-specific environment variables
        fastcgi_param APP_ENV "local";
    }

    # Static assets with long caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Laravel storage and public uploads
    location ~ ^/storage/app/public/(.*)$ {
        alias {{PROJECT_ROOT}}/storage/app/public/$1;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ ^/storage/(.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(composer|package|npm|yarn|\.env)\.(json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to artisan and test files
    location ~ ^/(artisan|tinker|test|phpunit)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle Laravel's public files properly
    location ~* \.(php)$ {
        return 404;
    }
}

{{#SSL}}
# HTTPS configuration for Laravel (internal)
server {
    listen {{NGINX_HTTPS_PORT}} ssl;
    listen [::]:{{NGINX_HTTPS_PORT}} ssl;
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}}/public;
    index index.php index.html index.htm;

    # Increase maximum file upload size (256MB)
    client_max_body_size 256M;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access-ssl.log;
    error_log {{LOGS_DIR}}/nginx-error-ssl.log;

    # SSL configuration (internal)
    ssl_certificate {{SSL_CERT_PATH}};
    ssl_certificate_key {{SSL_KEY_PATH}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Laravel-specific configuration
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Laravel-specific environment variables
        fastcgi_param APP_ENV "local";
    }

    # Static assets with long caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Laravel storage and public uploads
    location ~ ^/storage/app/public/(.*)$ {
        alias {{PROJECT_ROOT}}/storage/app/public/$1;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ ^/storage/(.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(composer|package|npm|yarn|\.env)\.(json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to artisan and test files
    location ~ ^/(artisan|tinker|test|phpunit)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle Laravel's public files properly
    location ~* \.(php)$ {
        return 404;
    }
}
{{/SSL}}
