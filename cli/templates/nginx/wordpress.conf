# Nginx configuration template for WordPress applications
# Optimized for WordPress with proper URL rewriting, security, and caching

upstream {{PROJECT_SLUG}}_php {
    server unix:{{PHP_FPM_SOCKET}};
}

server {
    listen {{NGINX_HTTP_PORT}};
    listen [::]:{{NGINX_HTTP_PORT}};
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}};
    index index.php index.html index.htm;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access.log;
    error_log {{LOGS_DIR}}/nginx-error.log;

    # WordPress-specific security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WordPress pretty permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM handling for WordPress
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # WordPress admin and includes
    location ~ ^/(wp-admin|wp-includes)/ {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ ^/wp-content/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # Static assets with appropriate caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Uploads directory - only allow specific file types
    location ~* ^/wp-content/uploads/.*\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive WordPress files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to WordPress PHP files that shouldn't be accessed directly
    location ~ ^/wp-(includes|admin)/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Allow XML-RPC for WordPress (if needed) - uncomment if you use it
    # location = /xmlrpc.php {
    #     try_files $uri =404;
    #     fastcgi_pass {{PROJECT_SLUG}}_php;
    #     fastcgi_index index.php;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }

    # WordPress REST API
    location ~ ^/wp-json/ {
        try_files $uri $uri/ /index.php?$args;
    }
}

{{#SSL}}
# HTTPS configuration for WordPress (internal)
server {
    listen {{NGINX_HTTPS_PORT}} ssl;
    listen [::]:{{NGINX_HTTPS_PORT}} ssl;
    server_name {{SERVER_NAME}};
    root {{PROJECT_ROOT}};
    index index.php index.html index.htm;

    # Logging
    access_log {{LOGS_DIR}}/nginx-access-ssl.log;
    error_log {{LOGS_DIR}}/nginx-error-ssl.log;

    # SSL configuration (internal)
    ssl_certificate {{SSL_CERT_PATH}};
    ssl_certificate_key {{SSL_KEY_PATH}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # WordPress-specific security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WordPress pretty permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM handling for WordPress
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PROJECT_SLUG}}_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # WordPress admin and includes
    location ~ ^/(wp-admin|wp-includes)/ {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ ^/wp-content/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # Static assets with appropriate caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Uploads directory - only allow specific file types
    location ~* ^/wp-content/uploads/.*\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to sensitive WordPress files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to WordPress PHP files that shouldn't be accessed directly
    location ~ ^/wp-(includes|admin)/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # WordPress REST API
    location ~ ^/wp-json/ {
        try_files $uri $uri/ /index.php?$args;
    }
}
